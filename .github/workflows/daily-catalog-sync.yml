name: Daily bhaJami Cloud Catalog Sync

on:
  schedule:
    - cron: '15 6,18 * * *'
  workflow_dispatch:
    inputs:
      max_songs_per_run:
        description: 'Max Sai Rhythms detail pages to process per run (default 300; ~55 min)'
        required: false
        default: '300'
        type: string
      skip_sairhythms:
        description: 'Skip Sai Rhythms crawl (fast index-only rebuild from existing Firestore docs)'
        required: false
        default: false
        type: boolean
      normalize_legacy_youtube:
        description: 'Retroactively normalize legacy YouTube titles, lyricsSets, and embeddable recordings in Firestore'
        required: false
        default: false
        type: boolean
      run_youtube:
        description: 'Run YouTube sync after Sai Rhythms (recommended after initial Sai Rhythms backfill finishes)'
        required: false
        default: false
        type: boolean
      max_youtube_videos:
        description: 'Max videos per YouTube source when run_youtube is true (default 200)'
        required: false
        default: '200'
        type: string
      run_sssmediacentre:
        description: 'Run SSS Media Centre (Bhajan A Day) MP3 enrichment when URLs seed file exists'
        required: false
        default: false
        type: boolean
      max_sssmediacentre_items:
        description: 'Max SSS Media Centre /listen pages to process per run (default 200)'
        required: false
        default: '200'
        type: string
      run_duplicate_check:
        description: 'Run daily proximity duplicate checker and queue candidates for Admin Review'
        required: false
        default: true
        type: boolean
      classify_special_tracks:
        description: 'Classify instrumental/karaoke/special tracks & repair truncated YouTube titles'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-catalog-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python crawler dependencies
        run: python3 -m pip install -r tools/catalog-pipeline/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node workspace dependencies
        run: npm ci

      - name: Verify TypeScript/Python Module 0 phonetic parity
        run: npm run test:phonetics

      - name: Restore Sai Rhythms SQLite checkpoint state
        uses: actions/cache@v4
        with:
          path: tools/catalog-pipeline/crawl_state.sqlite3
          key: sairhythms-state-${{ github.run_id }}
          restore-keys: |
            sairhythms-state-

      - name: Run Cloud Catalog Sync
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_SONGS: ${{ inputs.max_songs_per_run || '300' }}
          SKIP_SAIRHYTHMS: ${{ inputs.skip_sairhythms || 'false' }}
          NORMALIZE_LEGACY_YT: ${{ inputs.normalize_legacy_youtube || 'false' }}
          RUN_YOUTUBE: ${{ inputs.run_youtube || 'false' }}
          MAX_YT_VIDEOS: ${{ inputs.max_youtube_videos || '200' }}
          RUN_SSSMC: ${{ inputs.run_sssmediacentre || 'false' }}
          MAX_SSSMC_ITEMS: ${{ inputs.max_sssmediacentre_items || '200' }}
          RUN_DUPLICATE_CHECK: ${{ github.event_name == 'schedule' && 'true' || inputs.run_duplicate_check }}
          CLASSIFY_SPECIAL_TRACKS: ${{ inputs.classify_special_tracks || 'false' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret not configured; skipping cloud sync steps."
            exit 0
          fi

          SA_PATH="${{ runner.temp }}/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA_PATH"
          chmod 600 "$SA_PATH"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH"

          if [ "$SKIP_SAIRHYTHMS" != "true" ]; then
            echo "Running Sai Rhythms delta slice (max ${MAX_SONGS} songs)..."
            python3 tools/catalog-pipeline/crawl_sairhythms.py \
              --delta-only \
              --max-songs-per-run "$MAX_SONGS" \
              --publish-firestore \
              --max-firestore-writes 4000
          else
            echo "Sai Rhythms step skipped (skip_sairhythms=true)."
          fi

          if [ "$RUN_YOUTUBE" = "true" ] && [ -n "$YOUTUBE_API_KEY" ]; then
            echo "Running incremental YouTube Prasanthi Mandir Live sync (max ${MAX_YT_VIDEOS})..."
            python3 tools/catalog-pipeline/sync_youtube.py \
              --source youtube_mandir_live \
              --incremental \
              --max-videos "$MAX_YT_VIDEOS" \
              --liveness-check-limit 30 \
              --publish-firestore \
              --max-firestore-writes 4000

            echo "Running incremental YouTube Sri Sathya Sai Bhajans sync (max ${MAX_YT_VIDEOS})..."
            python3 tools/catalog-pipeline/sync_youtube.py \
              --source youtube_sss_bhajans \
              --incremental \
              --max-videos "$MAX_YT_VIDEOS" \
              --liveness-check-limit 30 \
              --publish-firestore \
              --max-firestore-writes 4000
          else
            echo "YouTube step skipped (run_youtube=${RUN_YOUTUBE}; Sai Rhythms backfill takes priority)."
          fi

          if [ "$NORMALIZE_LEGACY_YT" = "true" ]; then
            echo "Running retroactive legacy YouTube document normalization..."
            python3 tools/catalog-pipeline/normalize_legacy_youtube_docs.py \
              --publish-firestore \
              --max-firestore-writes 4000
          fi

          if [ "$RUN_SSSMC" = "true" ] && [ -f "tools/catalog-pipeline/sssmc_bhajan_a_day_urls.txt" ]; then
            echo "Running SSS Media Centre (Bhajan A Day) MP3 enrichment (max ${MAX_SSSMC_ITEMS})..."
            python3 tools/catalog-pipeline/sync_sssmediacentre.py \
              --urls-file tools/catalog-pipeline/sssmc_bhajan_a_day_urls.txt \
              --catalog-source firestore \
              --max-items-per-run "$MAX_SSSMC_ITEMS" \
              --publish-firestore \
              --max-firestore-writes 4000
          fi

          if [ "$CLASSIFY_SPECIAL_TRACKS" = "true" ]; then
            echo "Classifying instrumental/karaoke/special tracks & repairing truncated YouTube titles..."
            python3 tools/catalog-pipeline/classify_special_tracks.py \
              --source firestore \
              --publish-firestore \
              --max-firestore-writes 800
          fi

          if [ "$RUN_DUPLICATE_CHECK" != "false" ]; then
            echo "Running daily proximity duplicate checker..."
            python3 tools/catalog-pipeline/check_duplicates.py \
              --source firestore \
              --publish-firestore \
              --min-score 0.78 \
              --max-candidates 400 \
              --max-firestore-writes 800
          else
            echo "Duplicate checker skipped (run_duplicate_check=false)."
          fi

          echo "Rebuilding bounded Firestore search shards and catalogMeta/latest..."
          python3 tools/catalog-pipeline/index_builder.py \
            --source firestore \
            --publish-firestore \
            --max-firestore-writes 4000

      - name: Clean up temporary credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-sa.json"
